<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent FM</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --active: #3ddc84;
    --waiting: #f5c451;
    --error: #f16c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .layout { display: flex; height: 100vh; }
  aside {
    width: 220px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .session-item {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .session-item:hover { background: #1d212b; }
  .session-item.active { background: #232a38; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .session-item.active-status .dot { background: var(--active); }
  .session-item.waiting .dot { background: var(--waiting); }
  .session-item.error .dot { background: var(--error); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .toolbar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .toolbar button {
    background: #1d212b;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .toolbar button:hover { background: #232a38; }
  #timeline {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .entry { padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
  .entry.narration { color: var(--active); font-family: ui-sans-serif, system-ui, sans-serif; font-style: italic; }
  .entry.error { color: var(--error); }
  .entry.waiting { color: var(--waiting); }
  .entry.thinking { color: var(--muted); }
</style>
</head>
<body>
  <div class="layout">
    <aside id="sessions"></aside>
    <main>
      <div class="toolbar">
        <button id="mute" data-muted="false">Mute</button>
        <span id="queue-status">0 queued</span>
      </div>
      <div id="timeline"></div>
    </main>
  </div>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
